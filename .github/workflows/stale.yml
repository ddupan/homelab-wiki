name: stale

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # the 「文档待复核」 issue in this repository

jobs:
  stale:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-docs.txt
      # Watched repositories are public on Gitea or GitHub (moved ones are followed automatically). The
      # job token raises GitHub's read limit (60/h unauthenticated) and maintains this repository's issue.
      - name: Sync stale-page issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/stale_pages.py --issue
